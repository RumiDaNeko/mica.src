<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
:root{--canvas:#f6f4ef;--panel:#fffdf8;--ink:#1f1d1a;--muted:#77716a;--line:#e3ddd3;--cell:#ece7de;--accent:#3d6df2;--snake:#4cbf6a;--food:#e5534b}
:root.dark{--canvas:#17171a;--panel:#202024;--ink:#f1efe9;--muted:#9a968e;--line:#2e2e34;--cell:#26262b;--accent:#7a9cff;--snake:#5fd07c;--food:#ff6b61}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
main{height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:16px}
h1{font:400 30px Georgia,serif;margin:0 0 4px}
a.back{color:var(--muted);text-decoration:none;font-size:12px}a.back:hover{color:var(--ink)}
.side{width:150px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.big{font:400 26px Georgia,serif}
.board{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.08)}
canvas{display:block}
.overlay{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);text-align:center;padding:20px}
.overlay[hidden]{display:none}
.overlay h2{font:400 28px Georgia,serif;margin:0}
.overlay p{margin:0;color:var(--muted)}
button{font:inherit;border:0;border-radius:999px;padding:9px 20px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
kbd{font:11px "Segoe UI",sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel);color:var(--ink)}
@media (max-width:640px){main{flex-direction:column;gap:12px}.side{flex-direction:row;width:auto;flex-wrap:wrap;justify-content:center}.keys{display:none}}
</style>
</head>
<body>
<main>
 <div class="side">
  <div><a class="back" href="https://games.mica.invalid/">&larr; Games</a><h1>Snake</h1></div>
  <div class="card"><div class="label">Score</div><div class="big" id="score">0</div></div>
  <div class="card"><div class="label">Best</div><div class="big" id="best">0</div></div>
  <div class="card" id="pcard" hidden><div class="label">Power-up</div><div class="big" id="power" style="font-size:18px"></div></div>
  <div class="keys"><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&rarr;</kbd> <kbd>&darr;</kbd> or <kbd>WASD</kbd> steer<br><kbd>P</kbd> <kbd>Esc</kbd> pause<br>Grab the glowing bonus before it fades</div>
 </div>
 <div class="board">
  <canvas id="field"></canvas>
  <div class="overlay" id="overlay"><h2 id="otitle">Snake</h2><p id="otext">Eat, grow, don't bite yourself.</p><button id="start">Play</button></div>
 </div>
</main>
<script>
"use strict";
const N=20,$=id=>document.getElementById(id),field=$("field"),ctx=field.getContext("2d");
// Bonuses appear now and then and fade after about 7 seconds. Timed ones last 8 seconds once eaten.
const BONUS={gold:{label:"Gold",letter:"$",color:"#f2c230"},slow:{label:"Slow",letter:"S",color:"#35b9d6",ms:8000},ghost:{label:"Ghost",letter:"G",color:"#a06cf2",ms:8000},shrink:{label:"Shrink",letter:"-",color:"#f08a33"}};
let size=24,snake,dir,queued,food,bonus=null,effect=null,score,best=0,state="idle",timer=0;
try{best=+localStorage.getItem("mica-snake-best")||0}catch(e){}
$("best").textContent=best;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fit(){size=Math.max(12,Math.min(30,Math.floor((innerHeight-60)/N),Math.floor((innerWidth-220)/N)));const r=devicePixelRatio||1;field.width=N*size*r;field.height=N*size*r;field.style.width=N*size+"px";field.style.height=N*size+"px";ctx.setTransform(r,0,0,r,0,0);draw();}
function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};queued=[];score=0;bonus=null;effect=null;place();stats();power();}
function place(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});food=free.length?free[Math.floor(Math.random()*free.length)]:null;}
function stats(){$("score").textContent=score;if(score>best){best=score;$("best").textContent=best;try{localStorage.setItem("mica-snake-best",best)}catch(e){}}}
// A step every 130 ms, a little faster with every 5 eaten.
function delay(){return Math.max(60,130-Math.floor(score/5)*6)*(active("slow")?1.6:1);}
function active(kind){return effect&&effect.kind===kind&&effect.until>performance.now();}
function spawnBonus(kind){
 const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y)&&!(food&&food.x===x&&food.y===y))free.push({x,y});if(!free.length)return;
 const kinds=Object.keys(BONUS);kind=kind||kinds[Math.floor(Math.random()*kinds.length)];bonus=Object.assign(free[Math.floor(Math.random()*free.length)],{kind,until:performance.now()+7000});
}
function eatBonus(){
 const kind=bonus.kind;bonus=null;
 if(kind==="gold"){score+=5;stats();}
 else if(kind==="shrink"){for(let i=0;i<3&&snake.length>3;i++)snake.pop();score+=1;stats();}
 else effect={kind,until:performance.now()+BONUS[kind].ms};
 power();
}
function power(){const on=effect&&effect.until>performance.now();$("pcard").hidden=!on;if(on)$("power").innerHTML="<span style='color:"+BONUS[effect.kind].color+"'>"+BONUS[effect.kind].label+"</span> "+Math.ceil((effect.until-performance.now())/1000)+"s";}
function step(){
 if(state!=="play")return;
 if(queued.length)dir=queued.shift();
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},ghost=active("ghost");
 // A ghost goes through the walls (coming back on the other side) and through its own tail.
 if(ghost){head.x=(head.x+N)%N;head.y=(head.y+N)%N;}
 if(head.x<0||head.y<0||head.x>=N||head.y>=N||!ghost&&snake.slice(0,-1).some(s=>s.x===head.x&&s.y===head.y)){over();return;}
 snake.unshift(head);
 if(food&&head.x===food.x&&head.y===food.y){score++;stats();place();if(!food){win();return;}if(!bonus&&Math.random()<.28)spawnBonus();}else snake.pop();
 if(bonus&&head.x===bonus.x&&head.y===bonus.y)eatBonus();
 if(bonus&&bonus.until<performance.now())bonus=null;
 if(effect&&effect.until<=performance.now())effect=null;power();
 draw();timer=setTimeout(step,delay());
}
function turn(x,y){if(state!=="play")return;const last=queued.length?queued[queued.length-1]:dir;if(last.x===-x&&last.y===-y||last.x===x&&last.y===y||queued.length>2)return;queued.push({x,y});}
function show(t,p,b){$("otitle").textContent=t;$("otext").textContent=p;$("start").textContent=b;$("overlay").hidden=false;$("start").focus();}
function over(){state="over";clearTimeout(timer);draw();show("Game over",score+" eaten","Play again");}
function win(){state="over";clearTimeout(timer);draw();show("You filled the board!",score+" eaten","Play again");}
function start(){if(state!=="paused")reset();state="play";$("overlay").hidden=true;clearTimeout(timer);draw();timer=setTimeout(step,delay());}
function pause(){if(state==="play"){state="paused";clearTimeout(timer);show("Paused","Take a breath.","Resume");}else if(state==="paused")start();}
function draw(){
 if(!snake)reset();
 ctx.clearRect(0,0,N*size,N*size);ctx.fillStyle=css("--cell");
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x+y)%2)continue;ctx.fillRect(x*size,y*size,size,size);}
 if(food){ctx.fillStyle=css("--food");ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2,size*.36,0,7);ctx.fill();}
 if(bonus){
  // A bonus glows, with a ring that empties as it fades.
  const b=BONUS[bonus.kind],cx=bonus.x*size+size/2,cy=bonus.y*size+size/2,left=Math.max(0,(bonus.until-performance.now())/7000);
  ctx.fillStyle=b.color;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(cx,cy,size*.5,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(cx,cy,size*.36,0,7);ctx.fill();ctx.strokeStyle=b.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,size*.5,-Math.PI/2,-Math.PI/2+left*Math.PI*2);ctx.stroke();
  ctx.fillStyle="#fff";ctx.font="bold "+Math.round(size*.42)+"px Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b.letter,cx,cy+1);
 }
 const body=active("ghost")?BONUS.ghost.color:active("slow")?BONUS.slow.color:css("--snake");if(active("ghost"))ctx.globalAlpha=.6;
 const ghostly=active("ghost")?.6:1;snake.forEach((s,i)=>{ctx.globalAlpha=ghostly*(i===0?1:Math.max(.55,1-i/(snake.length*1.6)));ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(s.x*size+1,s.y*size+1,size-2,size-2,size/3);ctx.fill();});
 ctx.globalAlpha=1;
 const h=snake[0];ctx.fillStyle=css("--panel");const ex=dir.y?size*.22:0,ey=dir.x?size*.22:0;
 for(const k of [-1,1]){ctx.beginPath();ctx.arc(h.x*size+size/2+dir.x*size*.15+ex*k,h.y*size+size/2+dir.y*size*.15+ey*k,size*.09,0,7);ctx.fill();}
}
addEventListener("keydown",e=>{
 const k=e.code;
 if(["ArrowLeft","ArrowRight","ArrowDown","ArrowUp","Space"].includes(k))e.preventDefault();
 if(k==="KeyP"||k==="Escape"){pause();return;}
 if(state!=="play"){if((k==="Enter"||k==="Space")&&document.activeElement!==$("start"))start();return;}
 if(k==="ArrowLeft"||k==="KeyA")turn(-1,0);else if(k==="ArrowRight"||k==="KeyD")turn(1,0);else if(k==="ArrowUp"||k==="KeyW")turn(0,-1);else if(k==="ArrowDown"||k==="KeyS")turn(0,1);
});
addEventListener("blur",()=>{if(state==="play")pause();});
let touch=null;
field.addEventListener("touchstart",e=>{const t=e.touches[0];touch={x:t.clientX,y:t.clientY};e.preventDefault();},{passive:false});
field.addEventListener("touchmove",e=>{if(!touch)return;const t=e.touches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24){if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy));touch={x:t.clientX,y:t.clientY};}e.preventDefault();},{passive:false});
field.addEventListener("touchend",()=>{touch=null;});
$("start").addEventListener("click",start);
addEventListener("micatheme",function(){draw();});
addEventListener("resize",fit);
reset();fit();
</script>
</body>
</html>
