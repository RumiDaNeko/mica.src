<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--canvas-rgb:250,249,246;--glass-edge:rgba(255,255,255,.47);--ink:#302D38;--muted:#716B7A;--canvas:#FAF9F6;--panel:#FFFFFF;--line:#E9E5E9;--hover:#ECE7F2;--accent:#71608C;--art:.32;--shadow:0 4px 30px rgba(166,154,170,.16)}
html.dark{--canvas-rgb:36,33,42;--glass-edge:rgba(255,255,255,.13);--ink:#F0EBF5;--muted:#B0A7BC;--canvas:#24212A;--panel:#302B38;--line:#403948;--hover:#453C52;--accent:#C8B4E0;--art:.1;--shadow:0 4px 30px rgba(0,0,0,.18)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:13px "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Ubuntu,Cantarell,sans-serif;display:flex;flex-direction:column;padding:26px 40px 22px;overflow:auto;-webkit-font-smoothing:antialiased}
.top,.foot{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:#7C977D;margin-right:8px;vertical-align:1px}
#date{font-size:11px;color:var(--muted)}
main{flex:1;display:flex;align-items:center;justify-content:center}
.column{width:640px;max-width:100%;margin:30px 0}
.hero{position:relative;height:260px;display:flex;align-items:center;justify-content:center}
.hero svg{position:absolute;left:50%;top:0;width:340px;height:260px;transform:translateX(-50%);opacity:var(--art)}
.clock{position:relative;text-align:center}
#time{font:400 76px/1.05 Georgia,Cambria,"Noto Serif","DejaVu Serif",serif;color:var(--ink)}
#greeting{font-size:14px;color:var(--muted);margin-top:4px}
form{margin:22px 0 0;display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 18px 13px 22px;box-shadow:var(--shadow)}
form svg{flex:none}
input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:4px 0}
input::placeholder{color:var(--muted)}
kbd{font-size:10px;font-family:inherit;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.row{display:flex;justify-content:space-between;margin:34px 4px 12px}
#sites{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.site{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 2px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:11px}
.site:hover{background:var(--hover)}
.tile{width:52px;height:52px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);font-weight:600}
.site span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#recent{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:9px;background:var(--panel);border-radius:9px;padding:8px 14px 8px 12px;color:var(--ink);text-decoration:none;font-size:12px;max-width:220px}
.chip:hover{background:var(--hover)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{font-style:normal;width:16px;height:16px;border-radius:4px;background:var(--hover);color:var(--accent);font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
#empty{color:var(--muted);text-align:center;margin-top:14px}
.motto{font:italic 12px Georgia,Cambria,"Noto Serif",serif;color:var(--muted)}
.foot a,.foot button{font-size:10px;font-family:inherit;color:var(--muted);text-decoration:none;background:none;border:0;padding:3px 0;margin-left:18px;cursor:pointer}
.foot a:hover,.foot button:hover{color:var(--ink)}
#keys{display:none;position:fixed;right:40px;bottom:52px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);font-size:12px;line-height:2}
#keys.open{display:block}
#keys b{display:inline-block;min-width:150px;font-weight:400;color:var(--muted)}
/* A home background (Personalize): the picture fills the page, a scrim keeps the edges calm, and a frosted card sits
   behind the clock, search and sites, as on Windows (BrowserPersonalize.cs UpdateHomeGlass). */
#backdrop{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;display:none}
#scrim{position:fixed;inset:0;z-index:-1;display:none;background:linear-gradient(to bottom,rgba(var(--canvas-rgb),.8) 0,rgba(var(--canvas-rgb),.59) 7%,rgba(var(--canvas-rgb),0) 20%,rgba(var(--canvas-rgb),0) 80%,rgba(var(--canvas-rgb),.59) 93%,rgba(var(--canvas-rgb),.8) 100%)}
body.pictured{background:transparent}
body.pictured #backdrop,body.pictured #scrim{display:block}
body.pictured .column{position:relative}
body.pictured .column::before{content:"";position:absolute;inset:-26px -30px;z-index:-1;border-radius:26px;background:rgba(var(--canvas-rgb),var(--glass-fill));border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
body.pictured .hero svg{display:none}
/* Georgia lacks most Vietnamese letters; as on Windows, Vietnamese uses a serif that has them. */
html[lang=vi] .motto,html[lang=vi] #time{font-family:Cambria,"Noto Serif","DejaVu Serif",Georgia,serif}
</style>
</head>
<body>
<div id="backdrop"></div><div id="scrim"></div>
<div class="top"><span class="eyebrow"><span class="dot"></span>ROOM TO THINK</span><span id="date"></span></div>
<main><div class="column">
 <div class="hero">
  <svg viewBox="0 0 220 210" aria-hidden="true">
   <circle cx="109.5" cy="104.5" r="77.5" fill="#E6DFED"/><circle cx="109" cy="105" r="59" fill="#F4F0F7"/><circle cx="109" cy="105" r="39" fill="#D1C2E0"/>
   <ellipse cx="110" cy="106" rx="100" ry="34" fill="none" stroke="#9584AB" transform="rotate(-38 110 106)"/>
   <ellipse cx="110" cy="106" rx="100" ry="34" fill="none" stroke="#B0A0C2" transform="rotate(38 110 106)"/>
   <circle cx="180.5" cy="59.5" r="6.5" fill="#6F5B89"/><circle cx="33.5" cy="159.5" r="3.5" fill="#AF9AC5"/>
  </svg>
  <div class="clock"><div id="time">9:41</div><div id="greeting">Hello, you.</div></div>
 </div>
 <form action="/go" method="get" autocomplete="off">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><circle cx="13.5" cy="10.5" r="6.5"/><path d="M8.8 15.2 4 20"/></svg>
  <input name="q" placeholder="Search or type a web address" autofocus aria-label="Search or type a web address">
  <kbd>↵</kbd>
 </form>
 <div class="row"><span class="eyebrow">YOUR EVERYDAY</span><span class="eyebrow" style="font-weight:400">Most visited</span></div>
 <div id="sites"></div>
 <div id="empty">Your frequently visited sites will appear here.</div>
 <div id="recentSection" style="margin:26px 4px 0"><div class="eyebrow" style="margin-bottom:10px">PICK UP WHERE YOU LEFT OFF</div><div id="recent"></div></div>
</div></main>
<div class="foot"><span class="motto">Less noise. More internet.</span><span><a href="https://games.mica.invalid/">Games&nbsp;&nbsp;↗</a><button id="shortcuts" type="button">Keyboard shortcuts&nbsp;&nbsp;↗</button></span></div>
<div id="keys"></div>
<script>
const sites=/*SITES*/[],recent=/*RECENT*/[],look=/*LOOK*/null,vi=/*VI*/null;
const T=s=>vi&&vi[s]||s;
const mac=/*MAC*/false,mod=mac?'⌘':'Ctrl+';
function tick(){const now=new Date();
 document.getElementById('time').textContent=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M$/i,'');
 const h=now.getHours();document.getElementById('greeting').textContent=look&&look.private?T('Private browsing · history is not saved'):T(h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':h<22?'Good evening':'Good night')+'.';
 document.getElementById('date').textContent=look&&look.vi?now.toLocaleDateString('vi-VN',{weekday:'long'}).replace(/^./,c=>c.toUpperCase())+', '+now.getDate()+' tháng '+(now.getMonth()+1):now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
tick();setInterval(tick,15000);
const grid=document.getElementById('sites');
for(const s of sites){const a=document.createElement('a');a.className='site';a.href=s.u;a.title=s.t+'\n'+s.u;
 const host=new URL(s.u).hostname.replace(/^www\./,'');const tile=document.createElement('div');tile.className='tile';tile.textContent=(host[0]||'?').toUpperCase();
 const name=document.createElement('span');name.textContent=host.split('.')[0].replace(/^./,c=>c.toUpperCase());a.append(tile,name);grid.append(a);}
document.getElementById('empty').style.display=sites.length?'none':'';
if(look&&look.private){document.getElementById('empty').textContent="Sites from this private window won't be added to your history or Top Sites.";}
// The background: a preset (its base colour and three soft glows) or your photo.
if(look&&(look.preset||look.photo)){
 const b=document.getElementById('backdrop');
 if(look.photo)b.style.backgroundImage='url(/photo)';
 else{const[base,g1,g2,g3]=look.preset;const glow=(c,x,y)=>`radial-gradient(circle at ${x}% ${y}%,${c} 0,${c}00 75%)`;
  b.style.background=[glow(g1,12,85),glow(g2,88,12),glow(g3,92,92)].join(',')+','+base;}
 const g=look.glass==null?60:look.glass;
 document.body.style.setProperty('--blur',(g===0?30:12+g*.5)+'px');document.body.style.setProperty('--glass-fill',((40+g*1.5)/255).toFixed(3));
 document.body.classList.add('pictured');
}
const chips=document.getElementById('recent');
for(const r of recent){const a=document.createElement('a');a.className='chip';a.href=r.u;a.title=r.u;const i=document.createElement('i');const h=new URL(r.u).hostname.replace(/^www\./,'');i.textContent=(h[0]||'?').toUpperCase();const t=document.createElement('span');t.textContent=r.t||h;a.append(i,t);chips.append(a);}
document.getElementById('recentSection').style.display=recent.length?'':'none';
const keys=[['New tab',mod+'T'],['Close tab',mod+'W'],['Spotlight',mod+'K'],['Address',mod+'L'],['Find in page',mod+'F'],['Bookmark',mod+'D'],['Reopen closed tab',mod+'Shift+T'],['History',mac?'⌘Y':'Ctrl+H'],['Downloads',mac?'⌥⌘L':'Ctrl+J'],['Hide sidebar',mod+'Shift+B'],['Reload',mac?'⌘R':'F5'],['Back / forward',mac?'⌘[ / ⌘]':'Alt+← / →'],['Claude',mod+'Shift+Space']];
const box=document.getElementById('keys');for(const [k,v] of keys){const line=document.createElement('div');const b=document.createElement('b');b.textContent=k;line.append(b,v);box.append(line);}
document.getElementById('shortcuts').onclick=()=>box.classList.toggle('open');
// Mica's words in the chosen language (the same table as the window, src/Strings.vi.tsv).
if(vi){const walk=n=>{if(n.nodeType===3){const t=n.nodeValue.trim();if(t&&vi[t])n.nodeValue=n.nodeValue.replace(t,vi[t]);}else if(n.nodeType===1&&!n.closest('#sites,#recent')){for(const c of n.childNodes)walk(c);for(const a of ['placeholder','title','aria-label'])if(n.getAttribute(a)&&vi[n.getAttribute(a)])n.setAttribute(a,vi[n.getAttribute(a)]);}};walk(document.body);document.documentElement.lang='vi';}
</script>
</body>
</html>
