<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku</title>
<style>
:root{--canvas:#f6f4ef;--panel:#fffdf8;--ink:#1f1d1a;--muted:#77716a;--line:#e3ddd3;--cell:#ece7de;--accent:#3d6df2;--soft:#e7edff;--bad:#e5534b}
:root.dark{--canvas:#17171a;--panel:#202024;--ink:#f1efe9;--muted:#9a968e;--line:#2e2e34;--cell:#26262b;--accent:#7a9cff;--soft:#262c40;--bad:#ff6b61}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
main{height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:16px}
h1{font:400 30px Georgia,serif;margin:0 0 4px}
a.back{color:var(--muted);text-decoration:none;font-size:12px}a.back:hover{color:var(--ink)}
.side{width:160px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.big{font:400 26px Georgia,serif}
.board{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(9,var(--s));border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.c{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;font:400 calc(var(--s)*.56) Georgia,serif;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.c:nth-child(9n){border-right:0}.c:nth-child(3n):not(:nth-child(9n)){border-right:2px solid var(--ink)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--ink)}
.c:nth-child(n+73){border-bottom:0}
.c.given{font-weight:700}
.c.entered{color:var(--accent)}
.c.peer{background:var(--soft)}
.c.same{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.c.sel{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.c.bad{color:var(--bad)}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font:calc(var(--s)*.2) "Segoe UI",sans-serif;color:var(--muted);text-align:center;line-height:1}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{padding:8px 0;background:var(--cell);color:var(--ink);border-radius:10px}
.pad button.on{background:var(--accent);color:#fff}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.levels button{background:var(--cell);color:var(--ink);padding:6px 12px}
.levels button.on{background:var(--accent);color:#fff}
.overlay{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:8px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-align:center;padding:20px}
.overlay[hidden]{display:none}
.overlay h2{font:400 28px Georgia,serif;margin:0}
.overlay p{margin:0;color:var(--muted)}
button{font:inherit;border:0;border-radius:999px;padding:9px 20px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
@media (max-width:700px){main{flex-direction:column;gap:12px}.side{flex-direction:row;width:auto;flex-wrap:wrap;justify-content:center}.keys{display:none}}
</style>
</head>
<body>
<main>
 <div class="side">
  <div><a class="back" href="https://games.mica.invalid/">&larr; Games</a><h1>Sudoku</h1></div>
  <div class="card"><div class="label">Time · Best</div><div class="big"><span id="time">0:00</span> · <span id="best">–</span></div></div>
  <div class="levels" id="levels"></div>
  <div class="pad" id="pad"></div>
  <div class="keys">Arrows move · 1–9 fill<br>Backspace clears · N notes</div>
 </div>
 <div class="board">
  <div class="grid" id="grid"></div>
  <div class="overlay" id="overlay" hidden><h2 id="otitle"></h2><p id="otext"></p><button id="again">New puzzle</button></div>
 </div>
</main>
<script>
"use strict";
const LEVELS={easy:{name:"Easy",keep:40},medium:{name:"Medium",keep:32},hard:{name:"Hard",keep:26}};
const $=id=>document.getElementById(id),grid=$("grid");
let level="easy",solution,puzzle,board,notes,sel=-1,noting=false,t0=0,timer=0,done=false;
try{level=localStorage.getItem("mica-sudoku-level")||"easy";if(!LEVELS[level])level="easy";}catch(e){}
const row=i=>(i/9)|0,col=i=>i%9,box=i=>((row(i)/3)|0)*3+((col(i)/3)|0);
const PEERS=[...Array(81).keys()].map(i=>[...Array(81).keys()].filter(j=>j!==i&&(row(j)===row(i)||col(j)===col(i)||box(j)===box(i))));
function ok(b,i,v){return PEERS[i].every(j=>b[j]!==v);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fill(b){const i=b.indexOf(0);if(i<0)return true;for(const v of shuffle([1,2,3,4,5,6,7,8,9]))if(ok(b,i,v)){b[i]=v;if(fill(b))return true;}b[i]=0;return false;}
// Counts solutions, stopping at two: a puzzle is kept only while it has exactly one.
function count(b,limit){let best=-1,bestN=10;for(let i=0;i<81;i++)if(!b[i]){let n=0;for(let v=1;v<=9;v++)if(ok(b,i,v))n++;if(n<bestN){bestN=n;best=i;if(!n)return 0;}}if(best<0)return 1;let total=0;for(let v=1;v<=9&&total<limit;v++)if(ok(b,best,v)){b[best]=v;total+=count(b,limit-total);b[best]=0;}return total;}
function make(){solution=Array(81).fill(0);fill(solution);puzzle=solution.slice();let filled=81;for(const i of shuffle([...Array(81).keys()])){if(filled<=LEVELS[level].keep)break;const v=puzzle[i];puzzle[i]=0;if(count(puzzle.slice(),2)!==1)puzzle[i]=v;else filled--;}}
function best(){try{return +localStorage.getItem("mica-sudoku-best-"+level)||0}catch(e){return 0}}
function clock(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function levels(){const box=$("levels");box.innerHTML="";for(const k in LEVELS){const b=document.createElement("button");b.textContent=LEVELS[k].name;b.className=k===level?"on":"";b.onclick=()=>{level=k;try{localStorage.setItem("mica-sudoku-level",k)}catch(e){}levels();reset();};box.appendChild(b);}}
function pad(){const p=$("pad");p.innerHTML="";for(let v=1;v<=9;v++){const b=document.createElement("button");b.textContent=v;b.onclick=()=>put(v);p.appendChild(b);}const n=document.createElement("button");n.textContent="✎";n.title="Notes (N)";n.id="note";n.onclick=()=>{noting=!noting;n.className=noting?"on":"";};p.appendChild(n);}
function fit(){const s=Math.max(28,Math.min(60,Math.floor((Math.min(innerHeight-60,innerWidth-250)-24)/9)));grid.style.setProperty("--s",s+"px");}
function reset(){make();board=puzzle.slice();notes=[...Array(81)].map(()=>new Set());sel=-1;done=false;clearInterval(timer);t0=performance.now();$("time").textContent="0:00";timer=setInterval(()=>{if(!done&&!document.hidden)$("time").textContent=clock(Math.floor((performance.now()-t0)/1000));},1000);const b=best();$("best").textContent=b?clock(b):"–";$("overlay").hidden=true;build();draw();}
function build(){grid.innerHTML="";for(let i=0;i<81;i++){const c=document.createElement("div");c.className="c";c.dataset.i=i;grid.appendChild(c);}}
function draw(){
 const v=sel>=0?board[sel]:0;
 for(let i=0;i<81;i++){
  const c=grid.children[i],x=board[i];
  let k="c";if(puzzle[i])k+=" given";else if(x)k+=" entered";
  if(sel>=0&&i!==sel&&PEERS[sel].includes(i))k+=" peer";if(v&&x===v&&i!==sel)k+=" same";if(i===sel)k+=" sel";if(x&&!ok(board,i,x))k+=" bad";
  c.className=k;
  if(x)c.textContent=x;else if(notes[i].size){c.innerHTML='<div class="notes">'+[1,2,3,4,5,6,7,8,9].map(n=>"<span>"+(notes[i].has(n)?n:"")+"</span>").join("")+"</div>";}else c.textContent="";
 }
}
function put(v){
 if(done||sel<0||puzzle[sel])return;
 if(noting&&v){board[sel]=0;notes[sel].has(v)?notes[sel].delete(v):notes[sel].add(v);draw();return;}
 board[sel]=v;notes[sel].clear();
 if(v)for(const j of PEERS[sel])notes[j].delete(v);
 draw();if(board.every((x,i)=>x===solution[i]))win();
}
function win(){done=true;clearInterval(timer);const s=Math.max(1,Math.round((performance.now()-t0)/1000)),b=best();let note="Solved in "+clock(s);if(!b||s<b){try{localStorage.setItem("mica-sudoku-best-"+level,s)}catch(e){}$("best").textContent=clock(s);note+=" · a new best!";}$("otitle").textContent="Solved!";$("otext").textContent=note;$("overlay").hidden=false;$("again").focus();}
grid.addEventListener("click",e=>{const c=e.target.closest(".c");if(!c)return;sel=+c.dataset.i;draw();});
addEventListener("keydown",e=>{
 const k=e.key;
 if(k>="1"&&k<="9"){put(+k);return;}
 if(k==="Backspace"||k==="Delete"||k==="0"){put(0);return;}
 if(k==="n"||k==="N"){$("note").click();return;}
 const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[k];
 if(mv){e.preventDefault();if(sel<0)sel=40;else{const r=row(sel),c=col(sel);if(mv===-1)sel=r*9+(c+8)%9;else if(mv===1)sel=r*9+(c+1)%9;else sel=(sel+mv+81)%81;}draw();}
});
$("again").addEventListener("click",reset);
addEventListener("resize",fit);
levels();pad();fit();reset();
</script>
</body>
</html>
