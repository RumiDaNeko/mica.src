<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tetris</title>
<style>
:root{--canvas:#f6f4ef;--panel:#fffdf8;--ink:#1f1d1a;--muted:#77716a;--line:#e3ddd3;--cell:#ece7de;--accent:#3d6df2}
:root.dark{--canvas:#17171a;--panel:#202024;--ink:#f1efe9;--muted:#9a968e;--line:#2e2e34;--cell:#26262b;--accent:#7a9cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
main{height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:16px}
h1{font:400 30px Georgia,serif;margin:0 0 4px}
.side{width:150px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.big{font:400 26px Georgia,serif}
.board{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.08)}
canvas{display:block}
.overlay{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);text-align:center;padding:20px}
.overlay[hidden]{display:none}
.overlay h2{font:400 28px Georgia,serif;margin:0}
.overlay p{margin:0;color:var(--muted)}
button{font:inherit;border:0;border-radius:999px;padding:9px 20px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
kbd{font:11px "Segoe UI",sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel);color:var(--ink)}
.offline{font-size:12px;color:var(--muted)}
@media (max-width:640px){main{flex-direction:column;gap:12px}.side{flex-direction:row;width:auto;flex-wrap:wrap;justify-content:center}.keys{display:none}}
</style>
</head>
<body>
<main>
 <div class="side">
  <div><h1>Tetris</h1><div class="offline" id="net">Works offline, too.</div></div>
  <div class="card"><div class="label">Hold</div><canvas id="hold" width="96" height="64"></canvas></div>
  <div class="card"><div class="label">Score</div><div class="big" id="score">0</div></div>
  <div class="card"><div class="label">Best</div><div class="big" id="best">0</div></div>
 </div>
 <div class="board">
  <canvas id="field"></canvas>
  <div class="overlay" id="overlay"><h2 id="otitle">Tetris</h2><p id="otext">Stack the blocks, clear the lines.</p><button id="start">Play</button></div>
 </div>
 <div class="side">
  <div class="card"><div class="label">Next</div><canvas id="next" width="96" height="236"></canvas></div>
  <div class="card"><div class="label">Level · Lines</div><div class="big"><span id="level">1</span> · <span id="lines">0</span></div></div>
  <div class="keys"><kbd>←</kbd> <kbd>→</kbd> move<br><kbd>↑</kbd> <kbd>X</kbd> rotate · <kbd>Z</kbd> back<br><kbd>↓</kbd> soft drop<br><kbd>Space</kbd> hard drop<br><kbd>C</kbd> <kbd>Shift</kbd> hold<br><kbd>P</kbd> <kbd>Esc</kbd> pause</div>
 </div>
</main>
<script>
"use strict";
const W=10,H=20,HIDDEN=2;
const COLORS={I:"#35b9d6",O:"#f2c230",T:"#a05bd6",S:"#4cbf6a",Z:"#e5534b",J:"#3d6df2",L:"#f08a33"};
const SHAPES={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
// SRS wall kicks (y grows downward here, so the guideline's y values are negated).
const KICKS={"0>1":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"1>0":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],"1>2":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],"2>1":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"2>3":[[0,0],[1,0],[1,-1],[0,2],[1,2]],"3>2":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"3>0":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"0>3":[[0,0],[1,0],[1,-1],[0,2],[1,2]]};
const KICKS_I={"0>1":[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],"1>0":[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],"1>2":[[0,0],[-1,0],[2,0],[-1,-2],[2,1]],"2>1":[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],"2>3":[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],"3>2":[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],"3>0":[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],"0>3":[[0,0],[-1,0],[2,0],[-1,-2],[2,1]]};
const field=document.getElementById("field"),ctx=field.getContext("2d");
const holdCtx=document.getElementById("hold").getContext("2d"),nextCtx=document.getElementById("next").getContext("2d");
const $=id=>document.getElementById(id);
let size=28;
function fit(){size=Math.max(16,Math.min(32,Math.floor((innerHeight-60)/H),Math.floor((innerWidth-40)/(W+8))));const r=devicePixelRatio||1;field.width=W*size*r;field.height=H*size*r;field.style.width=W*size+"px";field.style.height=H*size+"px";ctx.setTransform(r,0,0,r,0,0);draw();}
function cells(type,rot){
 let c=SHAPES[type].map(p=>p.slice());const n=type==="I"||type==="O"?4:3;
 if(type==="O")return c;
 for(let i=0;i<rot;i++)c=c.map(([x,y])=>[n-1-y,x]);
 return c;
}
let board,piece,queue,bag,held,canHold,score,lines,level,best=0,state="idle",dropTimer=0,lockTimer=0,lockMoves=0,last=0,clearing=null;
try{best=+localStorage.getItem("mica-tetris-best")||0}catch(e){}
$("best").textContent=best;
function refill(){if(bag.length===0){bag=Object.keys(SHAPES);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}return bag.pop();}
function nextPiece(){while(queue.length<6)queue.push(refill());return spawn(queue.shift());}
function spawn(type){return {type,rot:0,x:type==="O"?3:3,y:HIDDEN-(type==="I"?1:0)};}
function fits(p,dx=0,dy=0,rot=p.rot){return cells(p.type,rot).every(([cx,cy])=>{const x=p.x+cx+dx,y=p.y+cy+dy;return x>=0&&x<W&&y<H+HIDDEN&&(y<0||!board[y][x]);});}
function reset(){board=Array.from({length:H+HIDDEN},()=>Array(W).fill(null));bag=[];queue=[];held=null;canHold=true;score=0;lines=0;level=1;piece=nextPiece();dropTimer=0;lockTimer=0;lockMoves=0;clearing=null;updateStats();}
function speed(){return Math.max(40,1000*Math.pow(0.8-(level-1)*0.007,level-1));}
function updateStats(){$("score").textContent=score;$("lines").textContent=lines;$("level").textContent=level;if(score>best){best=score;$("best").textContent=best;try{localStorage.setItem("mica-tetris-best",best)}catch(e){}}}
function move(dx){if(state!=="play"||clearing)return;if(fits(piece,dx,0)){piece.x+=dx;touched();}}
function rotate(dir){
 if(state!=="play"||clearing||piece.type==="O")return;
 const from=piece.rot,to=(from+dir+4)%4,table=piece.type==="I"?KICKS_I:KICKS;
 for(const [kx,ky] of table[from+">"+to]){if(fits(piece,kx,ky,to)){piece.x+=kx;piece.y+=ky;piece.rot=to;touched();return;}}
}
function grounded(){return !fits(piece,0,1);}
function touched(){if(grounded()&&lockMoves<15){lockTimer=0;lockMoves++;}}
function softDrop(){if(state!=="play"||clearing)return;if(fits(piece,0,1)){piece.y++;score+=1;dropTimer=0;updateStats();}}
function hardDrop(){if(state!=="play"||clearing)return;let n=0;while(fits(piece,0,1)){piece.y++;n++;}score+=n*2;lock();}
function hold(){
 if(state!=="play"||clearing||!canHold)return;canHold=false;
 const t=piece.type;if(held){piece=spawn(held);}else piece=nextPiece();held=t;
 dropTimer=0;lockTimer=0;lockMoves=0;if(!fits(piece))gameOver();
}
function lock(){
 let top=true;
 for(const [cx,cy] of cells(piece.type,piece.rot)){const y=piece.y+cy;if(y>=HIDDEN)top=false;if(y>=0)board[y][piece.x+cx]=piece.type;}
 if(top){gameOver();return;}
 const full=[];for(let y=0;y<H+HIDDEN;y++)if(board[y].every(Boolean))full.push(y);
 if(full.length){clearing={rows:full,t:0};score+=[0,100,300,500,800][full.length]*level;}
 else spawnNext();
 updateStats();
}
function finishClear(){
 for(const y of clearing.rows){board.splice(y,1);board.unshift(Array(W).fill(null));}
 lines+=clearing.rows.length;level=Math.floor(lines/10)+1;clearing=null;updateStats();spawnNext();
}
function spawnNext(){piece=nextPiece();canHold=true;dropTimer=0;lockTimer=0;lockMoves=0;if(!fits(piece))gameOver();}
function gameOver(){state="over";draw();show("Game over",score+" points · "+lines+" lines","Play again");}
function show(title,text,button){$("otitle").textContent=title;$("otext").textContent=text;$("start").textContent=button;$("overlay").hidden=false;$("start").focus();}
function start(){if(state==="over"||state==="idle")reset();state="play";$("overlay").hidden=true;last=performance.now();field.focus();run();}
function pause(){if(state==="play"){state="paused";show("Paused","Take a breath.","Resume");}else if(state==="paused")start();}
function tick(now){
 const dt=Math.min(100,now-last);last=now;
 if(state==="play"){
  if(clearing){clearing.t+=dt;if(clearing.t>=180)finishClear();}
  else if(grounded()){lockTimer+=dt;if(lockTimer>=500)lock();}
  else{lockTimer=0;dropTimer+=dt;if(dropTimer>=speed()){dropTimer=0;piece.y++;}}
 }
 draw();
 // Frames run only while a game is going; paused, over or not started, the board is drawn once and left.
 if(state==="play")requestAnimationFrame(tick);else running=false;
}
let running=false;
function run(){if(running)return;running=true;last=performance.now();requestAnimationFrame(tick);}
function block(c,x,y,s,color,alpha){c.globalAlpha=alpha;c.fillStyle=color;c.beginPath();c.roundRect(x+1,y+1,s-2,s-2,Math.max(2,s/6));c.fill();c.globalAlpha=alpha*.22;c.fillStyle="#fff";c.fillRect(x+3,y+3,s-6,Math.max(2,s/5));c.globalAlpha=1;}
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
function draw(){
 if(!board)reset();
 const cell=css("--cell");ctx.clearRect(0,0,W*size,H*size);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=cell;ctx.beginPath();ctx.roundRect(x*size+1,y*size+1,size-2,size-2,Math.max(2,size/6));ctx.fill();}
 for(let y=HIDDEN;y<H+HIDDEN;y++)for(let x=0;x<W;x++){const t=board[y][x];if(!t)continue;let a=1;if(clearing&&clearing.rows.includes(y))a=1-clearing.t/180;block(ctx,x*size,(y-HIDDEN)*size,size,COLORS[t],Math.max(0,a));}
 if(state!=="idle"&&!clearing&&piece){
  let g=0;while(fits(piece,0,g+1))g++;
  for(const [cx,cy] of cells(piece.type,piece.rot)){const y=piece.y+cy+g-HIDDEN;if(y>=0)block(ctx,(piece.x+cx)*size,y*size,size,COLORS[piece.type],.2);}
  for(const [cx,cy] of cells(piece.type,piece.rot)){const y=piece.y+cy-HIDDEN;if(y>=0)block(ctx,(piece.x+cx)*size,y*size,size,COLORS[piece.type],1);}
 }
 mini(holdCtx,held?[held]:[],canHold?1:.35);mini(nextCtx,state==="idle"?[]:queue.slice(0,5),1);
}
function mini(c,types,alpha){
 const s=16;c.clearRect(0,0,c.canvas.width,c.canvas.height);
 types.forEach((t,i)=>{const pts=cells(t,0),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const w=(Math.max(...xs)-Math.min(...xs)+1)*s,h=(Math.max(...ys)-Math.min(...ys)+1)*s;const ox=(c.canvas.width-w)/2-Math.min(...xs)*s,oy=i*46+(46-h)/2-Math.min(...ys)*s+(types.length===1?(c.canvas.height-46)/2:0);pts.forEach(([x,y])=>block(c,ox+x*s,oy+y*s,s,COLORS[t],alpha));});
}
// Held keys repeat after a short delay, like the classic games.
const repeat={};
function press(code,action,delay=150,rate=45){if(repeat[code])return;action();repeat[code]=setTimeout(function again(){action();repeat[code]=setTimeout(again,rate);},delay);}
function release(code){clearTimeout(repeat[code]);delete repeat[code];}
addEventListener("keydown",e=>{
 const k=e.code;
 if(["ArrowLeft","ArrowRight","ArrowDown","ArrowUp","Space"].includes(k))e.preventDefault();
 if(k==="KeyP"||k==="Escape"){pause();return;}
 if(state!=="play"){if((k==="Enter"||k==="Space")&&document.activeElement!==$("start"))start();return;}
 if(e.repeat&&["ArrowLeft","ArrowRight","ArrowDown"].includes(k))return;
 if(k==="ArrowLeft")press(k,()=>move(-1));
 else if(k==="ArrowRight")press(k,()=>move(1));
 else if(k==="ArrowDown")press(k,softDrop,0,40);
 else if(e.repeat)return;
 else if(k==="ArrowUp"||k==="KeyX")rotate(1);
 else if(k==="KeyZ"||k==="ControlLeft")rotate(-1);
 else if(k==="Space")hardDrop();
 else if(k==="KeyC"||k==="ShiftLeft"||k==="ShiftRight")hold();
});
addEventListener("keyup",e=>release(e.code));
addEventListener("blur",()=>{Object.keys(repeat).forEach(release);if(state==="play")pause();});
// Touch: tap rotates, swipe moves, swipe down drops.
let touch=null;
field.addEventListener("touchstart",e=>{const t=e.touches[0];touch={x:t.clientX,y:t.clientY,moved:false};e.preventDefault();},{passive:false});
field.addEventListener("touchmove",e=>{if(!touch)return;const t=e.touches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.abs(dx)>size){move(Math.sign(dx));touch.x=t.clientX;touch.moved=true;}else if(dy>size){softDrop();touch.y=t.clientY;touch.moved=true;}e.preventDefault();},{passive:false});
field.addEventListener("touchend",e=>{if(touch&&!touch.moved)rotate(1);touch=null;});
$("start").addEventListener("click",()=>state==="paused"?start():start());
function net(){$("net").textContent=navigator.onLine?"Works offline, too.":"You're offline. Play while it comes back.";}
addEventListener("online",net);addEventListener("offline",net);net();
addEventListener("resize",fit);
reset();fit();
addEventListener("micatheme",function(){try{draw();}catch(e){}});</script>
</body>
</html>
