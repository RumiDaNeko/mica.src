<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flappy</title>
<style>
:root{--canvas:#f6f4ef;--panel:#fffdf8;--ink:#1f1d1a;--muted:#77716a;--line:#e3ddd3;--cell:#ece7de;--accent:#3d6df2;--sky:#cfe6f5;--sky2:#eef6fb;--pipe:#4cbf6a;--pipe2:#3a9f56;--bird:#f2c230;--ground:#d9c9a3}
:root.dark{--canvas:#17171a;--panel:#202024;--ink:#f1efe9;--muted:#9a968e;--line:#2e2e34;--cell:#26262b;--accent:#7a9cff;--sky:#1b2433;--sky2:#26324a;--pipe:#3d9c58;--pipe2:#2f7d45;--bird:#f2c230;--ground:#3a352b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
main{height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:16px}
h1{font:400 30px Georgia,serif;margin:0 0 4px}
a.back{color:var(--muted);text-decoration:none;font-size:12px}a.back:hover{color:var(--ink)}
.side{width:150px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.big{font:400 26px Georgia,serif}
.board{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.08)}
canvas{display:block;border-radius:8px}
.overlay{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:8px;background:color-mix(in srgb,var(--panel) 80%,transparent);text-align:center;padding:20px}
.overlay[hidden]{display:none}
.overlay h2{font:400 28px Georgia,serif;margin:0}
.overlay p{margin:0;color:var(--muted)}
button{font:inherit;border:0;border-radius:999px;padding:9px 20px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
kbd{font:11px "Segoe UI",sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel);color:var(--ink)}
@media (max-width:640px){main{flex-direction:column;gap:12px}.side{flex-direction:row;width:auto;flex-wrap:wrap;justify-content:center}.keys{display:none}}
</style>
</head>
<body>
<main>
 <div class="side">
  <div><a class="back" href="https://games.mica.invalid/">&larr; Games</a><h1>Flappy</h1></div>
  <div class="card"><div class="label">Score</div><div class="big" id="score">0</div></div>
  <div class="card"><div class="label">Best</div><div class="big" id="best">0</div></div>
  <div class="keys"><kbd>Space</kbd> <kbd>&uarr;</kbd> or click flap<br><kbd>P</kbd> pause</div>
 </div>
 <div class="board">
  <canvas id="field"></canvas>
  <div class="overlay" id="overlay"><h2 id="otitle">Flappy</h2><p id="otext">Flap through the gaps.</p><button id="start">Play</button></div>
 </div>
</main>
<script>
"use strict";
// The field is 360 × 560 units, scaled to fit. Pipes scroll in from the right; the gap narrows a little as you go.
const FW=360,FH=560,GROUND=60,BX=90,BR=13,PIPE=58,SPACING=200;
const $=id=>document.getElementById(id),field=$("field"),ctx=field.getContext("2d");
let scale=1,bird,pipes,score,best=0,state="idle",last=0,frame=0,ticks=0,offset=0;
try{best=+localStorage.getItem("mica-flappy-best")||0}catch(e){}
$("best").textContent=best;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fit(){scale=Math.max(.5,Math.min(1.3,(innerHeight-60)/FH,(innerWidth-230)/FW));const r=devicePixelRatio||1;field.width=FW*scale*r;field.height=FH*scale*r;field.style.width=FW*scale+"px";field.style.height=FH*scale+"px";ctx.setTransform(scale*r,0,0,scale*r,0,0);draw();}
function gap(){return Math.max(118,160-score*1.5);}
function addPipe(x){const g=gap(),top=60+Math.random()*(FH-GROUND-120-g);pipes.push({x,top,gap:g,passed:false});}
function reset(){bird={y:FH/2-40,vy:0};pipes=[];score=0;ticks=0;for(let i=0;i<3;i++)addPipe(FW+120+i*SPACING);stats();}
function stats(){$("score").textContent=score;if(score>best){best=score;$("best").textContent=best;try{localStorage.setItem("mica-flappy-best",best)}catch(e){}}}
function show(t,p,b){$("otitle").textContent=t;$("otext").textContent=p;$("start").textContent=b;$("overlay").hidden=false;$("start").focus();}
function start(){if(state!=="paused")reset();state="play";$("overlay").hidden=true;last=performance.now();flap();loop();}
function pause(){if(state==="play"){state="paused";show("Paused","Take a breath.","Resume");}else if(state==="paused"){state="play";$("overlay").hidden=true;last=performance.now();loop();}}
function flap(){if(state==="play")bird.vy=-7.2;}
function over(){state="over";draw();show("Game over",score===1?"1 gap":score+" gaps","Play again");}
// Frames run only while playing; a paused or finished game draws once and stops.
function loop(){cancelAnimationFrame(frame);frame=requestAnimationFrame(tick);}
function tick(now){
 if(state!=="play"){draw();return;}
 const steps=Math.min(4,Math.max(1,Math.round((now-last)/(1000/60))));last=now;
 for(let i=0;i<steps&&state==="play";i++)step();
 draw();if(state==="play")frame=requestAnimationFrame(tick);
}
function step(){
 ticks++;bird.vy=Math.min(10,bird.vy+.42);bird.y+=bird.vy;
 const speed=2.4+Math.min(1.2,score*.03);offset=(offset+speed)%24;
 for(const p of pipes){p.x-=speed;if(!p.passed&&p.x+PIPE<BX-BR){p.passed=true;score++;stats();}}
 if(pipes.length&&pipes[0].x<-PIPE){pipes.shift();addPipe(pipes[pipes.length-1].x+SPACING);}
 if(bird.y+BR>=FH-GROUND){bird.y=FH-GROUND-BR;over();return;}
 if(bird.y-BR<0){bird.y=BR;bird.vy=0;}
 for(const p of pipes){
  if(BX+BR<p.x||BX-BR>p.x+PIPE)continue;
  if(bird.y-BR<p.top||bird.y+BR>p.top+p.gap){over();return;}
 }
}
function pipe(x,y,h,down){
 ctx.fillStyle=css("--pipe");ctx.fillRect(x,y,PIPE,h);ctx.fillStyle=css("--pipe2");ctx.fillRect(x+PIPE-10,y,10,h);
 const lip=down?y+h-20:y;ctx.fillStyle=css("--pipe");ctx.beginPath();ctx.roundRect(x-4,lip,PIPE+8,20,4);ctx.fill();ctx.fillStyle=css("--pipe2");ctx.fillRect(x+PIPE-8,lip,12,20);
}
function draw(){
 if(!bird)reset();
 const sky=ctx.createLinearGradient(0,0,0,FH);sky.addColorStop(0,css("--sky"));sky.addColorStop(1,css("--sky2"));ctx.fillStyle=sky;ctx.fillRect(0,0,FW,FH);
 for(const p of pipes){pipe(p.x,0,p.top,true);pipe(p.x,p.top+p.gap,FH-GROUND-p.top-p.gap,false);}
 ctx.fillStyle=css("--ground");ctx.fillRect(0,FH-GROUND,FW,GROUND);ctx.fillStyle="rgba(0,0,0,.08)";for(let x=-offset;x<FW;x+=24)ctx.fillRect(x,FH-GROUND,12,6);
 // The bird tips up when it flaps and noses down as it falls.
 const tilt=Math.max(-.5,Math.min(1.1,bird.vy/9));ctx.save();ctx.translate(BX,bird.y);ctx.rotate(tilt);
 ctx.fillStyle=css("--bird");ctx.beginPath();ctx.ellipse(0,0,BR+2,BR,0,0,7);ctx.fill();
 ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.ellipse(-4,4,7,4,-.4,0,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(6,-4,4.5,0,7);ctx.fill();ctx.fillStyle="#1f1d1a";ctx.beginPath();ctx.arc(7.5,-4,2,0,7);ctx.fill();
 ctx.fillStyle="#f08a33";ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(21,2);ctx.lineTo(12,6);ctx.fill();ctx.restore();
 if(state==="play"){ctx.fillStyle="rgba(0,0,0,.18)";ctx.font="400 44px Georgia";ctx.textAlign="center";ctx.fillText(score,FW/2+2,82);ctx.fillStyle="#fff";ctx.fillText(score,FW/2,80);}
}
addEventListener("keydown",e=>{
 const k=e.code;if(["ArrowUp","Space"].includes(k))e.preventDefault();
 if(k==="KeyP"||k==="Escape"){pause();return;}
 if(state!=="play"){if((k==="Enter"||k==="Space")&&document.activeElement!==$("start"))start();return;}
 if(k==="Space"||k==="ArrowUp"||k==="KeyW")flap();
});
field.addEventListener("pointerdown",e=>{e.preventDefault();if(state==="play")flap();});
addEventListener("blur",()=>{if(state==="play")pause();});
$("start").addEventListener("click",start);
addEventListener("resize",fit);
addEventListener("micatheme",function(){try{draw();}catch(e){}});
reset();fit();
</script>
</body>
</html>
