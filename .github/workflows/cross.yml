# Builds Mica's cross-platform shell (cross/: Avalonia + Chromium through CefGlue) on macOS and Linux, runs its
# self-test (off-screen; Linux under a virtual display), and uploads the self-test results and the packages.
# Packages are unsigned: signing and notarizing stay on the release machine.
name: Cross

on:
  push:
    paths: ['cross/**', 'src/Core.cs', 'src/BrowserUpdates.cs', 'src/ExtensionPackage.cs', 'src/AiExtensions.cs', 'src/DownloadModel.cs', 'src/Strings.vi.tsv', 'src/Reader.js', 'extensions/**', '.github/workflows/cross.yml']
  pull_request:
    paths: ['cross/**', 'src/Core.cs', 'src/BrowserUpdates.cs', 'src/ExtensionPackage.cs', 'src/AiExtensions.cs', 'src/DownloadModel.cs', 'src/Strings.vi.tsv', 'src/Reader.js', 'extensions/**', '.github/workflows/cross.yml']
  workflow_dispatch:
  # The cloud release (release.yml) builds the Mac and Linux packages through this workflow.
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: macos-latest
            target: macos
            arch: arm64
          # Intel Macs: a native x64 runner, so the self-test runs on Intel too.
          - os: macos-15-intel
            target: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Runners also carry a newer SDK, which `dotnet` would pick; with it, publishing on macOS loses CEF's
      # libEGL.dylib. Pin the build to SDK 8, as on the release machine.
      - name: Use .NET SDK 8
        run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
      - name: Chromium's libraries and a virtual display
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgtk-3-0 libxss1 libasound2t64 || \
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgtk-3-0 libxss1 libasound2
      # package.sh makes an AppImage too when appimagetool is there (and a PNG icon with ImageMagick).
      - name: appimagetool
        if: matrix.target == 'linux'
        run: |
          sudo apt-get install -y imagemagick
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Build and self-test
        run: bash cross/test.sh
        # Runners have no usable GPU: Chromium draws in software instead of restarting its GPU process.
        env:
          MICA_NO_GPU: '1'
      - name: Self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            cross/out/self-test.txt
            cross/out/test-profile/engine.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Package
        if: success() || failure()
        run: ARCH=${{ matrix.arch }} bash cross/package.sh ${{ matrix.target }}
      # The app as a user gets it: out of the disk image, its signature whole, named Mica, and it starts and passes
      # the self-test from there (helper processes included).
      - name: Check the Mac disk image
        if: matrix.target == 'macos'
        env:
          MICA_NO_GPU: '1'
        run: |
          dmg="$(ls cross/out/Mica-*.dmg | head -n 1)"; mount="$RUNNER_TEMP/mica-dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force >/dev/null 2>&1 || true' EXIT
          app="$mount/Mica.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|Sealed'
          test -L "$mount/Applications"
          # As if downloaded: a copy out of the image, quarantined. Gatekeeper rejects an ad-hoc app, but it must say
          # it can't check the developer ("rejected"/"unidentified"), never that the app is damaged.
          copy="$RUNNER_TEMP/downloaded/Mica.app"; rm -rf "$(dirname "$copy")"; mkdir -p "$(dirname "$copy")"; ditto "$app" "$copy"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$copy"
          codesign --verify --deep --strict --verbose=2 "$copy"
          verdict="$(spctl --assess --type execute -vv "$copy" 2>&1 || true)"; echo "Gatekeeper: $verdict"
          if echo "$verdict" | grep -qiE 'damaged|invalid signature|code has no resources|not signed at all'; then echo "::error::Gatekeeper sees a broken signature"; exit 1; fi
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = Mica ]
          # A throwaway profile, as test.sh uses, and at most 5 minutes (perl's alarm: macOS has no timeout).
          set +e; perl -e 'alarm shift; exec @ARGV' 300 "$app/Contents/MacOS/Mica" --self-test "$RUNNER_TEMP/dmg-test.txt" --profile "$RUNNER_TEMP/dmg-profile"; code=$?; set -e
          [ $code -eq 142 ] && echo "::error::The app from the image did not finish its self-test in 5 minutes"
          tail -n 5 "$RUNNER_TEMP/dmg-test.txt" 2>/dev/null || echo "No result file: the app from the image exited early (code $code)."
          grep '^FAIL' "$RUNNER_TEMP/dmg-test.txt" 2>/dev/null || true
          exit $code
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: mica-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            cross/out/*.tar.gz
            cross/out/*.AppImage
            cross/out/*.dmg
          if-no-files-found: ignore
          retention-days: 14
