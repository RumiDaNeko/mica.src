# Builds the Windows app (WPF + WebView2) on every push. build.ps1 fetches the WebView2 SDK itself.
# Installers and releases stay on the release machine: they need the signing key, which never leaves D:\creds.
name: Windows

on:
  push:
    paths: ['src/**', 'tests/**', 'installer/**', 'build.ps1', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'installer/**', 'build.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1 -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: mica-windows
          path: dist
          retention-days: 14
