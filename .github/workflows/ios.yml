# Builds Mica for iOS on a GitHub macOS runner (no Mac needed here) and takes simulator screenshots.
# The shared resources are generated on Windows first (node ios/tools/prepare.js) and pushed with the sources.
name: iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find the app
        # Works whether the repository is the whole project (ios/ inside) or just the iOS folder.
        run: echo "APP_DIR=$(test -d ios && echo ios || echo .)" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        working-directory: ${{ env.APP_DIR }}
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build for the simulator
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project Mica.xcodeproj -scheme Mica -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p shots
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in d for x in d[r] if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Mica.app
          xcrun simctl launch "$DEVICE" online.lessnoise.mica
          sleep 12
          xcrun simctl io "$DEVICE" screenshot shots/1-spotlight.png
          xcrun simctl openurl "$DEVICE" "mica-open://open?u=https%3A%2F%2Fen.wikipedia.org%2Fwiki%2FMica"
          sleep 15
          xcrun simctl io "$DEVICE" screenshot shots/2-page.png
          xcrun simctl openurl "$DEVICE" "mica-open://open?u=mica%3A%2F%2Fgames"
          sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/3-games.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 4
          xcrun simctl io "$DEVICE" screenshot shots/4-dark.png
          # The same app in Vietnamese.
          xcrun simctl terminate "$DEVICE" online.lessnoise.mica
          xcrun simctl launch "$DEVICE" online.lessnoise.mica -AppleLanguages "(vi)" -AppleLocale vi_VN
          sleep 8
          xcrun simctl io "$DEVICE" screenshot shots/5-vi.png
          xcrun simctl spawn "$DEVICE" log show --last 3m --predicate 'process == "Mica"' --style compact > shots/app.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mica-ios
          path: |
            ${{ env.APP_DIR }}/build.log
            ${{ env.APP_DIR }}/shots
          if-no-files-found: ignore
